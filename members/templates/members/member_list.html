<!-- members/templates/members/member_list.html -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Members</title></head>
<body>
<h1>Members</h1>
<ul>
{% for m in members %}
<li>{{ m.first_name }} {{ m.last_name }} - {{ m.phone }} ({{ m.joined_date }})
</li>
{% empty %}
<li>Nog geen members.</li>
{% endfor %}
</ul>
<p><a href="{% url 'member-create' %}">Member toevoegen</a></p>
</body>
</html>
