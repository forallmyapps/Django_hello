<!-- budget/templates/budget/transacties.html -->
<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Transacties</title></head>
<body>
    <h1>Mijn transacties</h1>
    <p>
    <a href="">Nieuw bestand uploaden</a> |
    <a href="">Bekijk grafiek</a>
    </p>
    <table border="1" cellpadding="6">
    <tr>
    <th>Datum</th><th>Bedrag</th><th>Categorie</th><th>Omschrijving</th>
    </tr>
    {% for t in transacties %}
    <tr>
    <td>{{ t.transactiedatum }}</td>
    <td>{{ t.bedrag }}</td>
    <td>{{ t.categorie }}</td>
    <td>{{ t.omschrijving|truncatechars:60 }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="4">Geen transacties gevonden.</td></tr>
    {% endfor %}
    </table>
</body>
</html>
